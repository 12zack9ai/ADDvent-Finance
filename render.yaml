# Render blueprint. See docs/DEPLOY-RENDER.md for the click-by-click.
#
# One service. The mailbox is polled from inside the web process (app/scheduler.py),
# so there is no cron job or worker to add - and nothing that would need its own
# copy of the disk.

services:
  - type: web
    name: addvent-finance
    runtime: python
    plan: starter          # The free plan sleeps when idle, which stops mail polling.
    region: ohio
    branch: main

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz

    # The database, every uploaded document, and the approval trail live here.
    # WITHOUT THIS DISK Render wipes the filesystem on every deploy and all of it
    # is lost. This is the one line that must not be removed.
    disk:
      name: finance-data
      mountPath: /var/lib/finance-automation
      sizeGB: 10           # thousands of scanned documents; can be raised later

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATA_DIR
        value: /var/lib/finance-automation
      - key: BASE_URL
        value: https://finance.addventuresinc.com
      - key: SITE_NAME
        value: Addventures Inc · Finance

      # sync: false means Render prompts for the value and keeps it out of git.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID   # only needed for an organisation-scoped key
        sync: false
      - key: APP_PASSWORD             # the shared password staff sign in with
        sync: false

      # Generated once and kept, so nobody is signed out on every deploy.
      - key: SECRET_KEY
        generateValue: true

      # --- mailbox: leave off until scripts/test_mail.py passes ---
      - key: MAIL_ENABLED
        value: "false"
      - key: IMAP_HOST
        value: addventuresinc.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_USER
        value: aiap@addventuresinc.com
      - key: IMAP_PASSWORD
        sync: false
      - key: MAIL_POLL_SECONDS
        value: "300"

      # Render's Python image has no Chromium, so the marked-up PDF is produced
      # by the browser's own Print / Save as PDF. Same stylesheet, same output.
