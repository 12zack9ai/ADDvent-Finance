# finance.adventuresinc.com
#
# Install:
#   sudo cp deploy/nginx-finance.conf /etc/nginx/sites-available/finance
#   sudo ln -s /etc/nginx/sites-available/finance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d finance.adventuresinc.com
#
# Certbot rewrites this file to add TLS and the port-80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name finance.adventuresinc.com;

    # Invoices and quotes are large scans; the default 1 MB would reject them.
    client_max_body_size 40M;

    # Reading a multi-page document takes a few seconds, and a batch upload
    # takes longer. Don't let nginx time out mid-extraction.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # This site holds vendor pricing. Keep it out of search engines and
    # out of referrer headers sent to third parties.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Health check, for monitoring. Not sensitive, but no need to log it.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }
}
