<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<style>
  :root{
    --ink:#1a1f2b; --soft:#4a5262; --mute:#767e8c;
    --rule:#e0e4ea; --rule-lt:#eef0f4; --bg:#f6f7f9; --panel:#fff;
    --navy:#1e3a5f; --accent:#2563a8; --accent-soft:#eaf1fa;
    --over-bg:#fbe4e2; --over-ink:#9b1c1c; --over-line:#d94a3d;
    --under-bg:#e3f5ea; --under-ink:#166534; --under-line:#2f9e5f;
    --ok-bg:#fbefc4; --ok-ink:#7a5c00; --ok-line:#d9a908;
    --none-bg:#eef0f3; --none-ink:#5a6270; --none-line:#a8b0bd;
    --warn-bg:#fdf3e0; --warn-ink:#7a5310; --warn-line:#c98a12;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  header.top{background:var(--navy);color:#fff;padding:0}
  .top-inner{max-width:1180px;margin:0 auto;padding:13px 24px;display:flex;
             align-items:center;gap:20px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:16px;letter-spacing:-.2px;color:#fff;white-space:nowrap}
  .brand span{opacity:.62;font-weight:500}
  .top nav{margin-left:auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .top nav a{color:#cfe0f5;font-weight:600;font-size:13px}
  .top nav a:hover{color:#fff}

  .search{flex:1;min-width:220px;max-width:420px;position:relative}
  .search input{
    width:100%;padding:8px 13px;border-radius:5px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.12);color:#fff;font-size:13.5px;outline:none;
  }
  .search input::placeholder{color:rgba(255,255,255,.62)}
  .search input:focus{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.45)}

  .wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px}

  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:7px;
         padding:18px 20px;margin-bottom:18px}
  .panel.tight{padding:14px 16px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px;color:var(--navy)}
  h2{font-size:15px;margin:0 0 12px;color:var(--navy)}
  .sub{color:var(--mute);font-size:13px;margin:0}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-start;
            gap:18px;margin-bottom:16px;flex-wrap:wrap}

  .chip{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11.5px;
        font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .c-over{background:var(--over-bg);color:var(--over-ink)}
  .c-ok{background:var(--under-bg);color:var(--under-ink)}
  .c-match{background:var(--ok-bg);color:var(--ok-ink)}
  .c-none{background:var(--none-bg);color:var(--none-ink)}
  .c-warn{background:var(--warn-bg);color:var(--warn-ink)}
  .c-info{background:var(--accent-soft);color:var(--accent)}

  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;
       padding:8px 16px;border-radius:5px;font-weight:700;font-size:13.5px;
       cursor:pointer;text-decoration:none}
  .btn:hover{background:#1d5192;text-decoration:none;color:#fff}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--rule)}
  .btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  table.grid{width:100%;border-collapse:collapse;font-size:13px}
  table.grid th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;
                color:var(--mute);font-weight:700;padding:0 9px 7px;border-bottom:1.5px solid var(--rule)}
  table.grid th.r{text-align:right}
  table.grid td{padding:9px;border-bottom:1px solid var(--rule-lt);vertical-align:middle}
  table.grid td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.grid tr:last-child td{border-bottom:none}
  table.grid tbody tr:hover{background:#fafbfc}

  .empty{text-align:center;padding:34px 20px;color:var(--mute)}
  .empty .big{font-size:15px;color:var(--soft);margin-bottom:5px;font-weight:600}

  .flash{padding:11px 15px;border-radius:5px;margin-bottom:15px;font-size:13.5px}
  .flash.ok{background:var(--under-bg);color:var(--under-ink);border-left:4px solid var(--under-line)}
  .flash.err{background:var(--over-bg);color:var(--over-ink);border-left:4px solid var(--over-line)}
  .flash.warn{background:var(--warn-bg);color:var(--warn-ink);border-left:4px solid var(--warn-line)}

  label.fld{display:block;font-size:12px;font-weight:700;color:var(--soft);
            margin-bottom:4px;letter-spacing:.2px}
  input[type=text],input[type=file],textarea,select{
    width:100%;padding:8px 11px;border:1px solid var(--rule);border-radius:5px;
    font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)
  }
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row > div{flex:1;min-width:190px}
  .muted{color:var(--mute);font-size:12.5px}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

  /* ---- 13-day cash flow ---- */
  .cf-headline{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
               border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin-bottom:14px}
  .cf-cell{background:#fff;padding:11px 14px}
  .cf-cell span{display:block;font-size:.68rem;letter-spacing:.8px;text-transform:uppercase;
                color:var(--mute);margin-bottom:3px}
  .cf-cell strong{font-size:1.25rem;font-variant-numeric:tabular-nums}
  .pos{color:#166534}
  .neg{color:#9b1c1c}
  .warn{color:#7a5310}
  .banner{padding:11px 15px;border-radius:6px;margin-bottom:14px;font-size:.95rem}
  .banner.bad{background:#fbe4e2;border-left:5px solid #d94a3d;color:#9b1c1c}
  .banner.good{background:#e3f5ea;border-left:5px solid #2f9e5f;color:#166534}
  .cf-days td{font-variant-numeric:tabular-nums}
  .cf-days tr.overdrawn td{background:#fbe4e2}
  .cf-days tr.overdrawn strong{color:#9b1c1c}
  table.list td.r, table.list th.r{text-align:right}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr} .cf-headline{grid-template-columns:1fr 1fr} }
  form.stack{display:flex;flex-direction:column;gap:12px}
  form.stack label{display:block;font-weight:600;font-size:.9rem}
  form.stack input[type=text],form.stack input:not([type]),form.stack input[type=date],
  form.stack input[type=file]{display:block;width:100%;margin-top:4px;padding:8px 10px;
    border:1px solid var(--rule);border-radius:6px;font:inherit;font-weight:400}
  form.stack .hint{display:block;font-weight:400;color:var(--mute);font-size:.8rem;margin-top:3px}
  form.stack label.check{font-weight:400}
  form.stack label.check input{margin-right:6px}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">Addventures <span>· Finance</span></a>
    <form class="search" action="/" method="get" role="search">
      <input type="text" name="q" value="{{ q or '' }}"
             placeholder="Search job number, vendor, or invoice number…" autocomplete="off">
    </form>
    <nav>
      <a href="/">Jobs</a>
      <a href="/approvals">Approvals</a>
      <a href="/cashflow">Cash flow</a>
      <a href="/vendors">Vendors</a>
      <a href="/inbox">Inbox{% if unassigned_count %} ({{ unassigned_count }}){% endif %}</a>
      <a href="/upload">Upload</a>
      <a href="/logout" style="opacity:.72">Sign out</a>
    </nav>
  </div>
</header>

<div class="wrap">
  {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message | safe }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
