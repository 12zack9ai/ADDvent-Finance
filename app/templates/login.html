<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{ site_name }}</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1e3a5f;color:#1a1f2b;
       font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
  .card{background:#fff;border-radius:9px;padding:32px 34px;width:100%;max-width:390px;
        box-shadow:0 10px 34px rgba(0,0,0,.28);margin:20px}
  h1{font-size:19px;margin:0 0 5px;color:#1e3a5f;letter-spacing:-.2px}
  p.sub{margin:0 0 22px;color:#767e8c;font-size:13px}
  label{display:block;font-size:12px;font-weight:700;color:#4a5262;margin-bottom:5px}
  input{width:100%;padding:10px 12px;border:1px solid #dfe3e9;border-radius:5px;
        font-size:14px;box-sizing:border-box}
  input:focus{outline:none;border-color:#2563a8}
  button{width:100%;margin-top:16px;background:#2563a8;color:#fff;border:none;padding:11px;
         border-radius:5px;font-weight:700;font-size:14px;cursor:pointer}
  button:hover{background:#1d5192}
  .err{background:#fbe4e2;color:#9b1c1c;border-left:4px solid #d94a3d;
       padding:9px 12px;border-radius:4px;margin-bottom:16px;font-size:13px}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>{{ site_name }}</h1>
    <p class="sub">Invoice checking and job pricing.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
